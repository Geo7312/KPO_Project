name: RepairDesk CI

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate commit messages
        shell: pwsh
        run: ./.github/scripts/check-commits.ps1
      - name: Restore
        run: dotnet restore RepairDesk.sln
      - name: Check code formatting
        run: dotnet format whitespace RepairDesk.sln --verify-no-changes --no-restore
      - name: Build and analyze
        shell: pwsh
        run: dotnet build RepairDesk.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true '-flp:logfile=build.log;verbosity=normal'
      - name: Unit tests with coverage
        run: dotnet test RepairDesk.Tests/RepairDesk.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Integration smoke test
        run: dotnet run --project RepairDesk.Smoke/RepairDesk.Smoke.csproj -c Release --no-build
      - name: Collect quality metrics
        if: always()
        shell: pwsh
        run: ./.github/scripts/measure.ps1 -Stage '${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'implementation' }}'
      - name: Publish application
        if: success()
        run: dotnet publish RepairDesk/RepairDesk.csproj -c Release --no-restore -o artifacts/publish
      - name: Package application
        if: success()
        shell: pwsh
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/RepairDesk-win.zip -Force
      - name: Upload test and metric reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            TestResults/
            artifacts/metrics.json
            build.log
          if-no-files-found: warn
      - name: Upload application package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RepairDesk-win
          path: artifacts/RepairDesk-win.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RepairDesk-win
          path: release
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/RepairDesk-win.zip --repo $env:GITHUB_REPOSITORY --generate-notes
